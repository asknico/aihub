# agents/codex/mappings.yaml
# 本 Agent 的路径映射：把 Hub 的权威资产映射到 Codex 的原生查找路径。
#
# 契约：根 AGENTS.md §10 —— 只做映射声明，禁止复制内容。
# target 为本机路径，启用同步前按实际安装位置核对。

skills:
  source: ../../shared/skills
  target: ~/.codex/skills

rules:
  source: ../../shared/rules
  target: ~/.codex/rules

prompts:
  source: ../../shared/prompts   # ⬜ shared/prompts/ 目前为空
  target: ~/.codex/prompts
