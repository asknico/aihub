# ==========================================================================
# validate —— 库内体检
# ==========================================================================
# 只调用仓库自己已经实现的脚本，不在工作流里内联业务逻辑。
# 这样本地（.githooks/pre-commit）与 CI 走的是同一套判定，不会出现
# 「本地过、CI 挂」或反过来的情况。
#
# 覆盖
#   · 环境变量解析、目录骨架、.env 与 .env.example 键名登记一致性
#   · 角色档引用有效性 + L0/L1 加载预算 + 单文件体积上限
#   · 换行符策略（依据 .gitattributes）
#   · scripts/ 下全部 Python 文件的语法
#
# 未覆盖（对应脚本仍是占位，实现后再加进来）
#   · frontmatter 完整性、registry 生成物一致性、密钥内容扫描
#     → scripts/validate.py、scripts/sync.py、scripts/security-check.py
# ==========================================================================

name: validate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 体检只需要读代码，不给任何写权限
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-check:
    name: 库内体检 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限取 3.11：脚本用到 `from __future__ import annotations` 与
        # `X | None` 注解，3.8+ 即可运行；这里取一个仍在维护的中间版本，
        # 再加一个最新版，用来发现仅在新版才暴露的问题。
        python: ["3.11", "3.13"]

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # scripts/lib/config.py 是全项目唯一 import yaml 的地方，
      # 预先装好可以让 install.py 不必在 CI 里走自动安装分支。
      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check PyYAML

      # 幂等：生成本地 .env、补齐缺失目录、按 registry/agents.yaml
      # 建立 agents/<id>/skills → shared/skills 的联接。
      - name: 初始化
        run: python scripts/install.py --yes

      - name: 环境与目录体检
        run: python scripts/install.py --check-only --yes

      - name: 角色档体检
        run: python scripts/install.py --check-only --yes --profile java-developer

      - name: 换行符策略
        run: python scripts/fix-eol.py

      - name: Python 语法
        run: python -m compileall -q scripts
